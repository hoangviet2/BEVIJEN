[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-degree-ndp-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
description = "Source-native NDP ingestion with raw archival and transformation handoff"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]

[project.scripts]
ndp-ingest = "ndp_ingestion.cli:main"

[tool.setuptools.packages.find]
include = ["ndp_ingestion*"]
