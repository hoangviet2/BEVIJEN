<!--
  Resource Engine — specialist review UI (single file, no build step).

  HOW IT GETS DATA
  - Served by the backend (same origin, e.g. https://<server>/ui/): it calls the real API.
  - Opened anywhere else (double-clicked file, GitHub Pages): it shows the sample data below.
  The banner at the top says which one is running.

  API CALLS USED (backend/app/routers/internal.py)
    GET  /health                         detect the backend
    GET  /records                        list of services (index rows)
    GET  /findings                       open problems (AI check, rules, user reports)
    GET  /records/{id}                   one record (HSDS) for the details panel
    POST /findings/{id}/apply            use the website / proposed value
    POST /findings/{id}/edit  {value}    specialist typed a new value
    POST /findings/{id}/dismiss {reason} keep our record
    POST /verify/{id}                    re-check one record
    POST /verify/batch {}                re-check all (admin)

  USER REPORTS: a finding with  source: "user_report"  is shown as a user report.
  Its  note  is the user's comment and  what_to_ask  the matched keywords.

  SIGN-IN: AUTH_MODE=dev needs nothing. With Cognito, the page reads a token from
  the URL (#id_token=...) or from a pasted token, and sends it as a Bearer header.
-->

const CODE_MAP = [ // longest prefix first
  ['BD-1800', ['Food', 'Urgent']], ['BH-1800', ['Housing', 'Urgent']], ['BD', ['Food']], ['BH', ['Housing']], ['BV', ['Money']],
  ['BM', ['Family & Household']], ['BT', ['Family & Household']], ['ND', ['Employment']], ['N', ['Money']],

function categoriesFromHsds(h) {

  (h.attributes || []).forEach((a) => {
    const t = a.taxonomy_term || {};
    const code = (t.code || '').toUpperCase(), name = (t.name || '').trim().toLowerCase();
    const direct = AREAS.find((x) => x.toLowerCase() === name || (x === 'Family & Household' && name === 'family & household'));
    if (direct) { out.add(direct); return; }
    const m = CODE_MAP.find(([pre]) => code.startsWith(pre));
    if (m) m[1].forEach((c) => out.add(c));

}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const t = token(); if (t) headers.Authorization = 'Bearer ' + t;
  if (CONFIG.DEV_USER) { headers['X-Dev-User'] = CONFIG.DEV_USER; headers['X-Dev-Groups'] = CONFIG.DEV_GROUPS; }
  const res = await fetch(CONFIG.API_BASE + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); if (j.detail) msg = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return res.status === 204 ? null : res.json();
}

async function loadLive() {
  const [records, findings] = await Promise.all([api('/records?limit=5000'), api('/findings')]);
  const old = Object.fromEntries(state.items.map((i) => [i.id, i]));
  state.items = toItems(records, findings).map((i) => { const o = old[i.id]; return { ...i, record: o && o.record, categories: o && o.categories }; });
  loadCategories();
  state.items.forEach((i) => { i.status = i.issues.length ? 'unverified' : 'verified'; });
  const latest = state.items.map((i) => i.checked).filter(Boolean).sort().pop();

/* Load each record once in the background to read its categories (for the list and the filter). */
let catLoading = false;
async function loadCategories() {
  if (catLoading) return; catLoading = true;
  const todo = state.items.filter((i) => !i.categories);
  const worker = async () => {
    while (todo.length) {
      const i = todo.shift();
      try { const rec = await api('/records/' + encodeURIComponent(i.id)); i.categories = categoriesFromHsds(rec.hsds || {}); }
      catch (e) { i.categories = ['Other']; }
    }
  };
  await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
  catLoading = false; render();
}
async function openLive(id) {

  if (!i) return;
  try {
    const rec = await api('/records/' + encodeURIComponent(id));
    Object.assign(i, detailsFromRecord(rec), { record: rec });
    if (!i.issues.length && i.verifiedBy) i.resolution = 'Verified by ' + i.verifiedBy + '.';

  const u = (/^https?:\/\//.test(url) ? url : 'http://' + url).split('#')[0];
  const enc = (t) => encodeURIComponent(t).replace(/-/g, '%2D').replace(/,/g, '%2C').replace(/&/g, '%26');
  const words = String(snippet || '').replace(/[“”"]/g, '').trim().split(/\s+/).filter(Boolean);
  const parts = [];
  // 1st choice: the exact sentence the AI quoted
  if (words.length) parts.push(words.length <= 8 ? enc(words.join(' ')) : enc(words.slice(0, 4).join(' ')) + ',' + enc(words.slice(-4).join(' ')));
  // back-up: the field's keyword (e.g. "hours"), so the page still jumps near the right place
  // 2nd choice: the new value itself as written on the site (for an address: street, then city)
  const val = String(value || '').trim();
  if (val) {
    const bits = field === 'address' ? val.split(',').map((t) => t.trim()).filter(Boolean).slice(0, 2) : [val];
    bits.filter((t) => t.split(/\s+/).length <= 8).forEach((t) => parts.push(enc(t)));
  }
  // 3rd choice: words that usually label this kind of field
  (FIELD_WORDS[field] || []).forEach((w) => parts.push(enc(w)));
  // last resort: the service's name (e.g. "Dining Room"), usually the heading of its section
  const sv = String(service || '').replace(/\(.*?\)/g, '').trim();
  if (sv && sv.split(/\s+/).length <= 6) parts.push(enc(sv));
  return parts.length ? u + '#:~:' + parts.map((x) => 'text=' + x).join('&') : u;
}
/* The copy of the page the AI read, with the quoted sentence highlighted.
   Works even when the live site is down, blocks us (403) or has changed since. */
function snapshotHtml(e, checked) {
  const body = String(e.page || e.context || e.text || e.snippet || '');
  const sn = String(e.snippet || '');
  const at = sn ? body.toLowerCase().indexOf(sn.toLowerCase()) : -1;
  const paint = (t) => esc(t).replace(/\n/g, '<br>');
  const html = at < 0 ? paint(body) : paint(body.slice(0, at)) + '<mark>' + paint(body.slice(at, at + sn.length)) + '</mark>' + paint(body.slice(at + sn.length));
  return '<div class="snap"><div class="snap-bar"><span class="mono">' + esc(e.url || '') + '</span><span>Saved copy' + (checked ? ' · ' + esc(show(checked)) : '') + '</span></div>' +
    '<div class="snap-page">' + html + '</div></div>';
}
function firstEvidence(i) {
  for (const x of i.issues || []) for (const e of x.evidence || []) if (e.url) return e;
  return null;
}
function areaChips(i) {
  if (!i.categories) return '<span class="areas"><span class="area muted-chip">…</span></span>';
  return '<span class="areas">' + i.categories.map((a) => '<span class="area">' + esc(a) + '</span>').join('') + '</span>';
}
function decisionFor(x) { return state.dec[x.fid] || {}; }
function issueHtml(i, x) {
  const d = decisionFor(x), label = LABELS[x.k] || x.field || 'Record';
  const isStale = x.cat === 'stale';
  const keepText = isStale ? 'Still correct — mark as checked today' : 'Keep our record';
  const opt = (choice, cls, title, value) =>
    '<button class="opt ' + cls + (d.choice === choice ? ' on' : '') + '" data-pick="' + esc(x.fid) + '" data-choice="' + choice + '" aria-pressed="' + (d.choice === choice) + '">' +
    '<span class="t"><span class="dot"></span>' + esc(title) + '</span>' + (value != null ? '<span class="v">' + esc(value || '(empty)') + '</span>' : '') + '</button>';
  const helper = x.note || (x.ask && x.ask.length ? 'Ask: ' + x.ask.join(' ') : '');
  const ev = (x.evidence || []).filter((e) => e.url || e.snippet).slice(0, 1).map((e) => {
    const shown = state.snap === x.fid;
    return '<div class="evid">' + (e.snippet ? '<q>' + esc(e.snippet) + '</q>' : '') +
      '<span class="evid-links">' +
      (e.snippet && (e.page || e.context || e.text) ? '<button class="linkbtn" data-snap="' + esc(x.fid) + '" aria-expanded="' + shown + '">' + (shown ? 'Hide' : 'Show') + ' saved copy (if the site is down)</button>' : '') +
      (/^https?:\/\/bevijen-demo\.example(?=[:/?#]|$)/i.test(e.url || '') ? (isPacificaDemoEvidence(e.url) ? '<a href="demo-evidence.html" target="_blank" rel="noopener">View synthetic demo evidence ↗</a>' : '<span>Synthetic demo evidence</span>') : e.url ? '<a href="' + esc(textLink(e.url, e.snippet, x.k, i.service, x.proposed)) + '" target="_blank" rel="noopener">Go to this on the website ↗</a>' : '') + '</span>' +
      (shown ? snapshotHtml(e, i.checked) : '') + '</div>';
  }).join('');
  return '<div class="issue">' +
    '<div class="issue-head"><span class="tag ' + x.cat + '">' + esc(CATS[x.cat].label) + '</span><span class="label">' + esc(label) + '</span></div>' +
    '<p class="issue-tip">' + esc(CATS[x.cat].tip) + (helper && i.origin !== 'report' ? ' ' + esc(helper) : '') + '</p>' + ev +
    '<div class="opts">' +
      opt('keep', '', keepText + (i.storedDate && !isStale ? ' · ' + i.storedDate : ''), isStale ? null : (x.current || i.details && i.details[x.k] || '')) +
      (x.use != null ? opt('web', 'web', (i.origin === 'report' ? 'Suggested' : 'Use website') + ' · ' + show(i.checked), x.proposed) : '') +
      opt('edit', '', 'Type a new value', null) +
    '</div>' +
    (d.choice === 'edit' ? '<label class="sr" for="e-' + esc(x.fid) + '">New ' + esc(label) + '</label><input class="edit-input" id="e-' + esc(x.fid) + '" data-edit="' + esc(x.fid) + '" value="' + esc(d.text != null ? d.text : (x.use != null ? text(x.use) : x.current || '')) + '">' : '') +
  '</div>';
}

function renderDialog() {
  const i = state.items.find((x) => x.id === state.openId);
  $('overlay').hidden = !i;
  if (!i) return;
  const open = i.status === 'unverified';
  const loading = state.live && !i.record;
  const flagged = new Set(open ? i.issues.map((x) => x.k) : []);
  const det = i.details || {};
  const keys = DETAIL_ORDER.filter((k) => k in det || flagged.has(k));
  const detailsHtml = keys.map((k) => {
    const v = det[k] || '';
    const isFlag = flagged.has(k);
    let extra = '';
    if (k === 'address' && v) {
      const q = encodeURIComponent(v);
      extra = '<iframe class="map" title="Map of ' + esc(v) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=' + q + '&z=15&output=embed"></iframe>' +
              '<a href="https://www.google.com/maps/search/?api=1&query=' + q + '" target="_blank" rel="noopener" class="small">Open in Google Maps ↗</a>';
    }
    if (k === 'website' && v) {
      const fe = open ? firstEvidence(i) : null;
      const fx = fe ? i.issues.find((x) => (x.evidence || []).includes(fe)) : null;
      extra = (fe && fx && isPacificaDemoEvidence(fe.url) ? '<a href="demo-evidence.html" target="_blank" rel="noopener" class="small">View synthetic demo evidence ↗</a>' :
               fe && fx && !/^https?:\/\/bevijen-demo\.example(?=[:/?#]|$)/i.test(fe.url || '') ? '<a href="' + esc(textLink(fe.url, fe.snippet, fx.k, i.service, fx.proposed)) + '" target="_blank" rel="noopener" class="small"><b>Go to ' + esc((LABELS[fx.k] || 'this').toLowerCase()) + ' on the website ↗</b></a>' : '') +
              '<a href="' + esc(/^https?:\/\//.test(v) ? v : 'http://' + v) + '" target="_blank" rel="noopener" class="small">Open agency website ↗</a>';
    }
    return '<div class="d' + (isFlag ? ' flag' : '') + '"><span>' + esc(LABELS[k]) + '</span><div><span>' + esc(v || '—') + '</span>' +
      (isFlag ? '<span class="flagnote">May be wrong — check and choose below</span>' : '') + extra + '</div></div>';
  }).join('');

  const decided = i.issues.filter((x) => decisionFor(x).choice);
  const hasDecisions = decided.length > 0;
  const impactText = !decided.length ? 'Choose at least one item to review. You can leave other items for later.'
    : decided.map((x) => { const d = decisionFor(x), l = (LABELS[x.k] || x.field).toLowerCase();
        return d.choice === 'web' ? 'use the new ' + l : d.choice === 'edit' ? 'set ' + l + ' to “' + (d.text != null ? d.text : text(x.use) || x.current) + '”' : x.cat === 'stale' ? 'mark the record as checked today' : 'keep the current ' + l; }).join('; ') + '. Confirm moves the record to Verified and logs the change under your name.';

  $('dialog').innerHTML =
    '<div class="d-head"><div>' +
      '<div class="tags">' + tagsHtml(i, true) + '</div>' +
      '<h2 id="dTitle">' + esc(i.org) + '</h2><p class="sub">' + esc(i.service) + '</p></div>' +
      '<button class="icon-btn" data-close aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>' +
    '</div>' +
    '<div class="d-body">' +
      (state.error ? '<div class="error">' + esc(state.error) + '</div>' : '') +
      '<div class="two"><div class="box"><span>ID</span><b class="mono">' + esc(i.id) + '</b></div><div class="box"><span>ZIP code</span><b class="mono">' + esc(i.zip) + '</b></div>' +
      '<div class="box"><span>Category</span><b>' + esc((i.categories || ['…']).join(', ')) + '</b></div></div>' +
      (loading ? '<p class="muted">Loading record…</p>' :
        (open && i.origin === 'report' && i.report ?
          '<div class="ureport"><span class="label" style="color:#93370D">What the user reported</span><q>' + esc(i.report.text) + '</q>' +
          '<span class="small">' + esc(i.report.by) + ' · ' + esc(i.report.date) + '</span>' +
          (i.report.keywords.length ? '<div class="tags"><span class="small">AI matched keywords:</span>' + i.report.keywords.map((k) => '<span class="kw">' + esc(k) + '</span>').join('') + '</div>' : '') +
          '<span class="small" style="color:#93370D">Fields that may be wrong are marked red in Details. Check the website, then decide below.</span></div>' : '') +
        '<div class="desc"><p class="label">Description</p><p>' + esc(i.desc || '—') + '</p></div>' +
        '<div class="details"><p class="label" style="margin-bottom:6px">Details</p>' + detailsHtml +
          '<div class="d"><span>Last edited</span><div>' + esc(i.editedBy + ' · ' + show(i.edited)) + '</div></div></div>' +
        (open ? '<div style="display:flex;flex-direction:column;gap:18px"><p class="label">What to do</p>' + i.issues.map((x) => issueHtml(i, x)).join('') + '</div>' +
                '<div class="impact"><b>Impact:</b><span>' + esc(impactText) + '</span></div>'
              : '<div class="done">' + esc(i.resolution || 'No open problems.') + '</div>')) +
    '</div>' +
    (open && !loading ? '<div class="d-foot" style="justify-content:space-between">' +
      '<button class="btn" data-close' + (state.saving ? ' disabled' : '') + '>← Back</button>' +
      '<span style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
      (hasDecisions ? '' : '<span class="small">Choose at least one item to confirm.</span>') +
      '<button class="btn primary" data-save' + (state.saving || !hasDecisions ? ' disabled' : '') + '>' + (state.saving ? 'Saving…' : 'Confirm') + '</button></span></div>' : '');
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
async function save(keepAll) {
  const i = state.items.find((x) => x.id === state.openId); if (!i) return;
  const plan = i.issues.map((x) => ({ x, d: keepAll ? { choice: 'keep' } : decisionFor(x) })).filter((p) => p.d.choice);
  if (!plan.length) return;
  state.saving = true; state.error = ''; render();
  const isList = (x) => Array.isArray(x.use) || /languages|service_areas|required_documents/.test(x.field || '');
  const valueOf = (p) => {
    if (p.d.choice === 'web') return p.x.use;
    const t = p.d.text != null ? p.d.text : (p.x.use != null ? text(p.x.use) : p.x.current);
    return isList(p.x) ? String(t).split(',').map((s) => s.trim()).filter(Boolean) : t;
  };
  const today = new Date().toISOString().slice(0, 10);
  if (state.live) {
    const errors = [];
    const label = (x) => LABELS[x.k] || x.field;
    // 1) changes first
    for (const p of plan.filter((q) => q.d.choice !== 'keep')) {
      try {
        if (p.d.choice === 'web') await api('/findings/' + p.x.fid + '/apply', { method: 'POST' });
        else await api('/findings/' + p.x.fid + '/edit', { method: 'POST', body: JSON.stringify({ value: valueOf(p) }) });
      } catch (e) { errors.push(label(p.x) + ': ' + e.message); }
    }
    // 2) then "keep". A change makes the server re-check the record, which can replace an open
    //    finding with a new one, so look the finding up again by category + field.
    const keeps = plan.filter((q) => q.d.choice === 'keep').sort((a, b) => (a.x.cat === 'stale' ? -1 : 0) - (b.x.cat === 'stale' ? -1 : 0));
    for (const p of keeps) {
      let open = [];
      try { open = ((await api('/records/' + encodeURIComponent(i.id))).findings || []).filter((f) => f.status === 'open'); } catch (e) {}
      {
        const f = open.find((o) => o.finding_id === p.x.fid) || open.find((o) => o.category === p.x.apiCat && o.field === p.x.field);
        if (!f) continue;
        try {
          if (p.x.cat === 'stale') await api('/findings/' + f.finding_id + '/edit', { method: 'POST', body: JSON.stringify({ value: today }) });
          else await api('/findings/' + f.finding_id + '/dismiss', { method: 'POST', body: JSON.stringify({ reason: 'kept current by specialist' }) });
        } catch (e) { errors.push(label(p.x) + ': ' + e.message); }
      }
    }
    try { await loadLive(); } catch (e) { errors.push('Reload failed: ' + e.message); }
    state.dec = {}; state.saving = false;
    const now = state.items.find((x) => x.id === i.id);
    if (errors.length) { state.error = 'Some changes were not saved. ' + errors.join(' · '); if (now) { now.record = null; openLive(i.id); } }
    else if (now && now.status === 'unverified') { now.record = null; openLive(i.id); }
    else { state.openId = null; }
    render();
    return;
  }
  // sample mode
  const done = new Set();
  plan.forEach((p) => {
    done.add(p.x.fid);
    if (p.d.choice === 'keep') return;
    const v = text(valueOf(p));
    if (p.x.k === 'desc') i.desc = v; else i.details[p.x.k] = v;
  });
  const now = nowIso();
  const names = plan.map((p) => (LABELS[p.x.k] || p.x.field).toLowerCase() + (p.d.choice === 'keep' ? ' (kept)' : ''));
  i.issues = i.issues.filter((x) => !done.has(x.fid));
  Object.assign(i, { edited: now, editedBy: SAMPLE_USER, checked: now });
  if (!i.issues.length) { i.status = 'verified'; i.resolution = 'Reviewed ' + names.join(', ') + ' — ' + SAMPLE_USER + ', ' + show(now) + '.'; state.openId = null; }
  state.dec = {}; state.saving = false; render();
}

async function recheck(ids, all) {
  ids.forEach((id) => (state.checking[id] = true));
  if (all) state.allChecking = true;
  render();
  if (state.live) {
    try {
      if (all) { try { await api('/verify/batch', { method: 'POST', body: '{}' }); } catch (e) { for (const id of ids) await api('/verify/' + id, { method: 'POST' }); } }
      else await api('/verify/' + ids[0], { method: 'POST' });
    } catch (e) { alert('Re-check failed: ' + e.message); }
  }
  setTimeout(async () => {
    if (state.live) { try { await loadLive(); } catch (e) {} }
    else { const now = nowIso(); state.items.forEach((i) => { if (ids.includes(i.id)) i.checked = now; }); if (all) state.lastRun = now; }
    ids.forEach((id) => (state.checking[id] = false));
    if (all) state.allChecking = false;
    render();
  }, state.live ? CONFIG.RECHECK_WAIT_MS : (all ? 1800 : 1200));
}

/* ---- events ---- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.open) { state.openId = t.dataset.open; state.dec = {}; state.snap = null; state.error = ''; $('filterPop').hidden = true; render(); if (state.live) openLive(t.dataset.open); }
  else if (t.dataset.recheck) recheck([t.dataset.recheck], false);
  else if (t.dataset.tab) { state.tab = t.dataset.tab; render(); }
  else if (t.dataset.snap) {
    state.snap = (state.snap === t.dataset.snap && !t.dataset.jump) ? null : t.dataset.snap; renderDialog();
    const m = document.querySelector('#dialog .snap mark') || document.querySelector('#dialog .snap');
    if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (t.dataset.pick) { const cur = state.dec[t.dataset.pick] || {}; state.dec[t.dataset.pick] = { ...cur, choice: t.dataset.choice }; renderDialog(); }
  else if ('close' in t.dataset) { state.openId = null; render(); }
  else if ('save' in t.dataset) save(false);
  else if ('signin' in t.dataset) { const v = $('tok').value.trim(); setToken(v); start(); }
});
document.addEventListener('input', (e) => {
  const f = e.target.dataset && e.target.dataset.edit;
  if (f) { state.dec[f] = { ...(state.dec[f] || {}), choice: 'edit', text: e.target.value }; }
});
$('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') { state.openId = null; render(); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.openId) { state.openId = null; render(); } });
$('recheckAll').addEventListener('click', () => { if (!state.allChecking) recheck(state.items.map((i) => i.id), true); });
$('filterBtn').addEventListener('click', () => { const p = $('filterPop'); p.hidden = !p.hidden; $('filterBtn').setAttribute('aria-expanded', String(!p.hidden)); });
$('doneFilter').addEventListener('click', () => { $('filterPop').hidden = true; $('filterBtn').setAttribute('aria-expanded', 'false'); });
$('clearFilter').addEventListener('click', () => {
  state.cats = Object.fromEntries(CAT_ORDER.map((k) => [k, true])); state.srcs = { report: true, ai: true }; state.areas = Object.fromEntries(AREAS.map((k) => [k, true])); state.from = ''; state.to = '';
  $('from').value = ''; $('to').value = ''; buildFilterOptions(); render();
});
$('from').addEventListener('change', (e) => { state.from = e.target.value; render(); });
$('to').addEventListener('change', (e) => { state.to = e.target.value; render(); });
$('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
$('q').addEventListener('input', (e) => {
  state.q = e.target.value.trim(); render();
  try { const u = new URL(location.href); state.q ? u.searchParams.set('q', state.q) : u.searchParams.delete('q'); history.replaceState(null, '', u); } catch (err) {}
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !state.openId) { e.preventDefault(); $('q').focus(); }
});
function buildFilterOptions() {
  $('srcOptions').innerHTML = [['report', 'User report', 'A help seeker or navigator said something is wrong.'], ['ai', 'AI check', 'The AI or a rule found a problem.']].map(([k, l, tip]) =>
    '<label class="check"><input type="checkbox" data-src="' + k + '"' + (state.srcs[k] ? ' checked' : '') + '><span><span class="tag ' + k + '">' + l + '</span><small>' + tip + '</small></span></label>').join('');
  $('areaOptions').innerHTML = AREAS.map((k) =>
    '<label class="check" style="align-items:center"><input type="checkbox" data-area="' + esc(k) + '"' + (state.areas[k] ? ' checked' : '') + ' style="margin:0"><span style="font-size:14px">' + esc(k) + '</span></label>').join('');
  $('catOptions').innerHTML = CAT_ORDER.map((k) =>
    '<label class="check"><input type="checkbox" data-cat="' + k + '"' + (state.cats[k] ? ' checked' : '') + '><span><span class="tag ' + k + '">' + esc(CATS[k].label) + '</span><small>' + esc(CATS[k].tip) + '</small></span></label>').join('');
}
$('filterPop').addEventListener('change', (e) => {
  if (e.target.dataset.cat) { state.cats[e.target.dataset.cat] = e.target.checked; render(); }
  if (e.target.dataset.src) { state.srcs[e.target.dataset.src] = e.target.checked; render(); }
  if (e.target.dataset.area) { state.areas[e.target.dataset.area] = e.target.checked; render(); }
});

/* ---- start ---- */
async function start() {
  const m = location.hash.match(/id_token=([^&]+)/);
  if (m) { setToken(decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  buildFilterOptions();
  try { const q0 = new URL(location.href).searchParams.get('q'); if (q0) { state.q = q0; $('q').value = q0; } } catch (err) {}
  state.live = await detectBackend();
  if (state.live) {
    try {
      await loadLive();
      $('mode').className = 'mode live';
      $('mode').innerHTML = '<b>Live data</b>&nbsp;from the Resource Engine backend.';
      $('footnote').textContent = 'Records and findings come from the backend API. Changes are saved with your account.';
    } catch (e) {
      if (e.status === 401 || e.status === 403) {
        $('mode').className = 'mode err';
        $('mode').innerHTML = '<b>Sign in needed.</b> <a href="' + esc(CONFIG.API_BASE) + '/auth/login">Sign in</a> or paste a token: ' +
          '<label for="tok" class="sr">Token</label><input id="tok" placeholder="id_token"><button class="btn sm" data-signin>Use token</button>';
      } else {
        $('mode').className = 'mode err'; $('mode').textContent = 'Could not load data from the backend: ' + e.message;
      }
      state.items = [];
    }
  } else {
    loadSample();
    $('mode').className = 'mode sample';
    $('mode').innerHTML = '<b>Sample data.</b>&nbsp;This page isn’t connected to the backend. Serve it from the backend (for example at /ui/) to see live records.';
    $('footnote').textContent = 'Records: 211 Bay Area sample (NDP). Website values, user reports and editor names are test data.';
  }
  render();
}
start();
